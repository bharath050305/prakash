<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prakash – Smart Streetlight Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F5;--surface:#FFFFFF;--surface2:#F4F6FA;--ink:#101A2D;--muted:#586479;--line:#DBE1EA;
  --side:#0E1A33;--side2:#182A50;--side-ink:#B7C4DD;
  --lamp:#F5A00B;--lamp-ink:#8A5300;--lamp-soft:#FFF0CC;
  --ok:#0F8A72;--ok-soft:#DBF2EA;--warn:#D0620A;--warn-soft:#FFE8D0;--bad:#C9342F;--bad-soft:#FBDFDD;
  --info:#2A66E0;--info-soft:#E0EAFD;--violet:#6B4FD3;--violet-soft:#E9E4FB;
  --head:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#080E1C;--surface:#111A31;--surface2:#16213D;--ink:#E8EDF7;--muted:#93A1BB;--line:#22304F;
  --side:#060B17;--side2:#111C38;--side-ink:#98A9C8;
  --lamp:#FFB21F;--lamp-ink:#FFC963;--lamp-soft:#3A2A0A;
  --ok:#3CCFAE;--ok-soft:#0F3A33;--warn:#FF9A3D;--warn-soft:#402508;--bad:#FF6B67;--bad-soft:#40181A;
  --info:#7AA2FF;--info-soft:#172C57;--violet:#A996FF;--violet-soft:#282050;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080E1C;--surface:#111A31;--surface2:#16213D;--ink:#E8EDF7;--muted:#93A1BB;--line:#22304F;
    --side:#060B17;--side2:#111C38;--side-ink:#98A9C8;
    --lamp:#FFB21F;--lamp-ink:#FFC963;--lamp-soft:#3A2A0A;
    --ok:#3CCFAE;--ok-soft:#0F3A33;--warn:#FF9A3D;--warn-soft:#402508;--bad:#FF6B67;--bad-soft:#40181A;
    --info:#7AA2FF;--info-soft:#172C57;--violet:#A996FF;--violet-soft:#282050;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.brand .logo{width:36px;height:36px;border-radius:50%;background:var(--lamp);display:grid;place-items:center;color:#2B1A00;box-shadow:0 0 0 5px rgba(245,160,11,.16),0 0 24px rgba(245,160,11,.45)}
.brand b{font:700 19px var(--head);display:block;line-height:1.1}
.brand span{font-size:11.5px;color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;padding:9px 10px;border-radius:9px;color:var(--side-ink);text-align:left;font-weight:500;position:relative}
.nav button:hover{background:var(--side2);color:#fff}
.nav button[aria-current="page"]{background:var(--side2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--lamp)}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--side2);border-radius:12px;font-size:12px;line-height:1.45}
.side-foot b{color:#fff;font-weight:600;display:block;font-size:13px}
.side-foot button{margin-top:8px;background:none;border:0;color:var(--lamp);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* main */
main{padding:22px 26px 40px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:26px;font-weight:700}
.top p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:500;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(15,138,114,.6);animation:ping 1.8s infinite}
.pill.off .dot{background:var(--muted);animation:none}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:17px;height:17px}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(15,138,114,0)}100%{box-shadow:0 0 0 0 rgba(15,138,114,0)}}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.grid{display:grid;gap:14px;margin-top:14px}
.grid.main{grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr)}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.chead{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.c-crit{background:var(--bad-soft);color:var(--bad)}.c-high{background:var(--warn-soft);color:var(--warn)}
.c-med{background:var(--lamp-soft);color:var(--lamp-ink)}.c-low{background:var(--ok-soft);color:var(--ok)}
.c-info{background:var(--info-soft);color:var(--info)}.c-mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#2B1A00;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.mono{font-family:var(--mono);font-size:12.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--lamp)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font:700 30px/1.15 var(--head);margin:2px 0}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi .bar{margin-top:6px}

/* map */
.mapwrap{position:relative;background:#0A1326;border-top:1px solid #1B2A4A}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap text{font-family:'IBM Plex Sans',sans-serif}
.tip{position:absolute;pointer-events:none;background:#0E1A33;color:#E8EDF7;border:1px solid #2A3B63;padding:8px 10px;border-radius:8px;font-size:12px;z-index:5;min-width:170px;display:none;line-height:1.45}
.sel{position:absolute;left:12px;bottom:12px;background:#0E1A33ee;color:#E8EDF7;border:1px solid #2A3B63;border-radius:10px;padding:10px 12px;font-size:12.5px;max-width:300px;z-index:4}
.sel button{position:absolute;top:4px;right:6px;background:none;border:0;color:#93A1BB;font-size:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.75}100%{transform:scale(2.7);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-24}}
.route{animation:dash 1.4s linear infinite}

/* feed */
.feed{max-height:600px;overflow:auto;margin:0 -16px;padding:0}
.fi{padding:11px 16px;border-top:1px solid var(--line);display:block;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.fi:hover{background:var(--surface2)}
.fi p{margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.fi .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ch{font:500 11.5px var(--mono);color:var(--muted)}
.fi.new{animation:flash 2.2s ease-out}
@keyframes flash{0%{background:var(--lamp-soft)}100%{background:transparent}}
.chartbox{position:relative;height:240px;margin-top:10px}

/* analyzer */
.an{grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr)}
textarea{width:100%;margin:12px 0 8px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:400 15px/1.55 'IBM Plex Sans',sans-serif;resize:vertical;min-height:112px}
.samples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.samples button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted)}
.samples button:hover{color:var(--ink);border-color:var(--muted)}
.steps{list-style:none;margin:10px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--muted)}
.steps li:last-child{border:0}
.steps .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px}
.steps li.done{color:var(--ink)}
.steps li.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.run .tick{border-color:var(--lamp);border-top-color:transparent;animation:spin .7s linear infinite}
.steps li b{font-weight:500}
.steps li em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.hltext{font-size:16px;line-height:2.1;margin:10px 0 4px}
mark.ent{background:none;border-radius:6px;padding:2px 4px;border-bottom:2px solid}
mark.ent small{font:500 10px var(--mono);margin-left:4px;opacity:.85}
.e-POLE_ID{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.e-LOCATION{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.e-LANDMARK{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.e-DURATION{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.e-FAULT{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.prob{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.prob .bar{height:9px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13.5px;margin-top:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.reply{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note{border-radius:8px;padding:9px 12px;font-size:13px;margin-top:10px}
.note.info{background:var(--info-soft);color:var(--info)}.note.warn{background:var(--warn-soft);color:var(--warn)}
ul.why{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}

/* schedule */
.tech{border-left:4px solid var(--c);}
.tech ol{margin:8px 0 0;padding-left:0;list-style:none}
.tech li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.tech li .n{width:22px;height:22px;border-radius:50%;background:var(--c);color:#0A1326;font:600 12px var(--head);display:grid;place-items:center}
.cmp td:nth-child(n+2){font-family:var(--mono);font-size:13px}
.good{color:var(--ok);font-weight:600}

/* alerts */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert.ack{opacity:.5}
.alert h4{margin:0;font-size:14px;font-weight:600}
.alert p{margin:1px 0 0;color:var(--muted);font-size:13px}

/* architecture */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;margin-top:14px;position:relative}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.stage:not(:last-child)::after{content:"";position:absolute;right:-22px;top:50%;width:22px;height:2px;background:var(--lamp)}
.stage h3{font-size:15px;margin-bottom:8px;color:var(--ink)}
.stage li{margin:4px 0;font-size:13px;color:var(--muted)}
.stage ul{margin:0;padding-left:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* toast */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13.5px;max-width:340px;animation:in .25s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:0}}

@media (max-width:1100px){.grid.main,.grid.two,.an,.grid.three{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:minmax(0,1fr);gap:26px}.stage:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-26px;width:2px;height:26px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;border-top:1px solid var(--side2)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;align-items:center;text-align:center}
  .nav button[aria-current="page"]::before{display:none}
  .nav .badge{position:absolute;top:0;right:8px;margin:0;font-size:10px;padding:0 5px;min-width:16px}
  main{padding:16px 14px 92px}
  .top h1{font-size:22px}
  .prob{grid-template-columns:110px 1fr 40px}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){.kpi b{font-size:24px}.kpi{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h6M10 21V7a4 4 0 0 1 4-4h3"/><path d="M15 3h5v4h-5z" fill="currentColor"/></svg></div>
      <div><b>Prakash</b><span>Streetlight maintenance</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><b>Group 6 · SDG 11</b>Sustainable cities and communities. Prototype running on synthetic data.<br><button id="reset">Reset demo data</button></div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="pgTitle"></h1><p id="pgSub"></p></div>
      <div class="tools">
        <button class="pill" id="liveBtn" aria-pressed="true" title="Simulate new complaints arriving"><span class="dot"></span><span id="liveTxt">Live intake</span></button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch colour theme"></button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ───────────── helpers ───────────── */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ago=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const fmtClock=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mm=String(m%60).padStart(2,'0');return (h%12||12)+':'+mm+' '+(h<12?'AM':'PM')};
const IC={
 overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 analyze:'<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',
 hotspots:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 predict:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 schedule:'<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
 alerts:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
 arch:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ───────────── city model ───────────── */

    while((w=wre.exec(cap))){const lw=w[0].toLowerCase();if(first<0&&(lw==='the'||lw==='a'))continue;if(STOP.has(lw))break;

  const t={id,ts,channel,text:a.text,cls:a.cls,conf:a.conf,sev:a.sev.score,sevLabel:a.sev.label,zone:a.geo?a.geo.zone.id:null,x:a.lamp?a.lamp.x:a.geo?a.geo.x:null,y:a.lamp?a.lamp.y:a.geo?a.geo.y:null,lampId:a.lamp?a.lamp.id:null,status:a.geo?'open':'review',due:ts+SLA[a.sev.label]*36e5};
  if(a.lamp&&a.lamp.status==='ok'){a.lamp.status='fault';a.lamp.f90++}
  S.tickets.unshift(t);return t;
}

/* ───────────── map ───────────── */
function mapSVG(o={}){
  const id=o.id||'m',layers=o.layers||{heat:true,lamps:true,clusters:true};
  const stats=zoneStats();
  let s=`<svg viewBox="0 0 760 540" role="img" aria-label="Map of streetlights across eight city zones"><defs>
   <radialGradient id="hg${id}"><stop offset="0" stop-color="#FF4D4D" stop-opacity=".62"/><stop offset=".55" stop-color="#FF8A3D" stop-opacity=".22"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></radialGradient>
   <radialGradient id="rg${id}"><stop offset="0" stop-color="#9B7BFF" stop-opacity=".6"/><stop offset=".55" stop-color="#7B5CFF" stop-opacity=".2"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<path d="M0 0H205C222 90 190 165 214 232C238 300 190 385 216 462L232 540H0Z" fill="#0B2A4A"/><text x="60" y="270" fill="#4B78A8" font-size="13" font-style="italic">Thane Creek</text>`;
  s+=`<ellipse cx="560" cy="360" rx="70" ry="34" fill="#0F2A2A"/><ellipse cx="640" cy="215" rx="55" ry="22" fill="#0F2A2A"/><ellipse cx="520" cy="215" rx="40" ry="18" fill="#0F2A2A" opacity=".7"/>`;
  ROADS.forEach((r,i)=>{s+=`<path d="M${r.map(p=>p.join(' ')).join('L')}" stroke="#1C2D50" stroke-width="${i?8:12}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`});
  if(layers.heat){
    stats.forEach(st=>{
      const v=o.hmode==='recurring'?st.f90/6:o.hmode==='risk'?st.riskSum/2.2:st.open;
      if(v<=0)return;
      s+=`<circle cx="${st.z.x}" cy="${st.z.y}" r="${Math.min(120,34+v*9)}" fill="url(#${o.hmode==='risk'?'rg':'hg'}${id})" opacity="${Math.min(1,.4+v*.1).toFixed(2)}"/>`;
    });
  }
  if(layers.clusters)clusters().forEach(c=>{s+=`<circle cx="${c.x.toFixed(0)}" cy="${c.y.toFixed(0)}" r="${c.r.toFixed(0)}" fill="none" stroke="#FFB21F" stroke-width="1.4" stroke-dasharray="5 4" opacity=".85"/><text x="${(c.x+c.r*.7).toFixed(0)}" y="${(c.y-c.r*.7).toFixed(0)}" font-size="11.5" font-weight="600" fill="none" stroke="#0A1326" stroke-width="3.4" stroke-linejoin="round">${c.n} faults</text><text x="${(c.x+c.r*.7).toFixed(0)}" y="${(c.y-c.r*.7).toFixed(0)}" font-size="11.5" font-weight="600" fill="#FFB21F">${c.n} faults</text>`});
  if(layers.lamps)S.lamps.forEach(l=>{
    const ok=l.status==='ok',asg=l.status==='assigned';
    s+=`<g data-lamp="${l.id}" style="cursor:pointer"><circle cx="${l.x}" cy="${l.y}" r="9" fill="transparent"/>`;
    if(ok)s+=`<circle cx="${l.x}" cy="${l.y}" r="6.5" fill="#F5A00B" opacity=".14"/><circle cx="${l.x}" cy="${l.y}" r="2.5" fill="#FFD27A"/>`;
    else if(asg)s+=`<circle cx="${l.x}" cy="${l.y}" r="7" fill="none" stroke="#2CD3B5" stroke-width="1.5"/><circle cx="${l.x}" cy="${l.y}" r="3.4" fill="#2CD3B5"/>`;
    else s+=`<circle class="pulse" cx="${l.x}" cy="${l.y}" r="6" fill="#FF4D4D"/><circle cx="${l.x}" cy="${l.y}" r="3.7" fill="#FF5A5A" stroke="#fff" stroke-width=".9"/>`;
    s+='</g>';
  });
  ZONES.forEach(z=>{const a=`x="${z.x+14}" y="${z.y-12}" font-size="12.5" font-weight="500"`;s+=`<text ${a} fill="none" stroke="#0A1326" stroke-width="3.6" stroke-linejoin="round">${z.name}</text><text ${a} fill="#A9BAD9">${z.name}</text>`});
  if(o.routes)o.routes.forEach(r=>{
    if(!r.jobs.length)return;
    const pts=[r.depot,...r.jobs,r.depot];
    s+=`<polyline class="route" points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${r.color}" stroke-width="2.6" stroke-dasharray="8 6" stroke-linejoin="round" opacity=".95"/>`;
    s+=`<rect x="${r.depot.x-8}" y="${r.depot.y-8}" width="16" height="16" rx="3" fill="${r.color}" stroke="#0A1326" stroke-width="2"/><text x="${r.depot.x}" y="${r.depot.y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#0A1326">${r.name[0]}</text>`;
    r.jobs.forEach((j,i)=>{s+=`<circle cx="${j.x}" cy="${j.y}" r="9" fill="${r.color}" stroke="#0A1326" stroke-width="2"/><text x="${j.x}" y="${j.y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#0A1326">${i+1}</text>`});
  });
  if(o.mark){const m=o.mark;s+=`<circle class="pulse" cx="${m.x}" cy="${m.y}" r="10" fill="#2CD3B5"/><circle cx="${m.x}" cy="${m.y}" r="9" fill="none" stroke="#2CD3B5" stroke-width="2"/><path d="M${m.x} ${m.y-9}v-22" stroke="#2CD3B5" stroke-width="2"/><rect x="${m.x-58}" y="${m.y-56}" width="116" height="22" rx="6" fill="#2CD3B5"/><text x="${m.x}" y="${m.y-41}" text-anchor="middle" font-size="12" font-weight="600" fill="#052A22">Detected location</text>`}
  return s+'</svg>';
}
const STATUS_TXT={ok:'Working',fault:'Faulty',assigned:'Crew assigned'};
function bindMap(wrap){
  const tip=wrap.querySelector('.tip');
  wrap.addEventListener('mousemove',e=>{
    const g=e.target.closest('[data-lamp]');if(!g){tip.style.display='none';return}
    const l=LMAP.get(g.dataset.lamp);if(!l)return;
    const t=S.tickets.find(k=>k.lampId===l.id&&k.status!=='resolved');
    tip.innerHTML=`<b class="mono">${l.id}</b><br>${STATUS_TXT[l.status]} · ${ZM[l.zone].name}<br>Age ${l.age} y · ${l.f90} faults in 90 days`+(t?`<br><span style="color:#FFB21F">${CLASSES[t.cls].label}</span>`:'');

    d.querySelector('button').onclick=()=>d.remove();wrap.appendChild(d);
  });
}

let CHARTS=[];
function mkChart(el,cfg){
  if(!window.Chart||!el)return null;
  const cs=getComputedStyle(document.documentElement);
  Chart.defaults.color=cs.getPropertyValue('--muted').trim();Chart.defaults.font.family="'IBM Plex Sans',sans-serif";Chart.defaults.borderColor=cs.getPropertyValue('--line').trim();
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options||{});
  const c=new Chart(el,cfg);CHARTS.push(c);return c;
}

function kpiHTML(){
  const op=openT(),hi=op.filter(t=>t.sevLabel==='Critical'||t.sevLabel==='High'),now=Date.now();
  const late=op.filter(t=>t.due<now&&t.status!=='resolved').length;
  const total=S.lamps.length,bad=S.lamps.filter(l=>l.status!=='ok').length,online=Math.round((total-bad)/total*100);
  const auto=S.tickets.filter(t=>t.conf>=.55&&t.zone).length,auto_p=Math.round(auto/Math.max(1,S.tickets.length)*100);
  const hr=S.tickets.filter(t=>now-t.ts<36e5).length;
  return `<div class="kpi"><span>Open tickets</span><b>${op.length}</b><small>${hr} in the last hour</small></div>
  <div class="kpi"><span>Critical and high</span><b>${hi.length}</b><small>${late} already past SLA</small></div>
  <div class="kpi"><span>Lamps working</span><b>${online}%</b><small>${bad} of ${total} faulty</small><div class="bar"><i style="width:${online}%;background:var(--ok)"></i></div></div>
  <div class="kpi"><span>Triaged automatically</span><b>${auto_p}%</b><small>class and location found, no human</small></div>`;
}

const SAMPLES=[
 ['Flickering + safety','The light near SIES College Nerul keeps flickering on and off since 3 days. Students walk here at night, very unsafe.','WhatsApp'],
 ['Exposed wire','Caller reports sparks and a wire hanging from the pole near Vashi Station!','Call centre'],

 ['Hindi','नेरुल स्टेशन के पास स्ट्रीट लाइट बंद है, अंधेरा है','WhatsApp'],
 ['Pole ID','SL-NER-021 not glowing near D Y Patil Stadium','Web portal'],
 ['No location','Street light not working near the temple, please fix ASAP','Email']
];
function pgAnalyze(){
  if(!S.an.text){S.an.text=SAMPLES[0][1];S.an.ch=SAMPLES[0][2]}
  $('#view').innerHTML=`<div class="grid an" style="margin-top:0">
   <div class="card"><h3>Incoming complaint</h3><p class="sub">Any channel goes through the same pipeline. Paste a message or pick an example.</p>
    <div class="seg" id="chSeg" style="margin-top:12px">${CHANNELS.map(c=>`<button data-c="${c}" aria-pressed="${S.an.ch===c}">${c}</button>`).join('')}</div>

    <button class="btn primary" id="go">Analyze complaint</button></div>
   <div class="card"><h3>Pipeline</h3><p class="sub">Six steps, run in order</p><ul class="steps" id="steps"></ul></div>
  </div><div id="result"></div>`;
  $$('#chSeg button').forEach(b=>b.onclick=()=>{S.an.ch=b.dataset.c;$$('#chSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});

  $('#go').onclick=()=>run();

let runTok=0;
function run(fast){
  const text=$('#txt').value.trim();if(!text){toast('Type a complaint first.');return}
  S.an.text=text;const tok=++runTok,a=analyze(text);
  const rows=[['Language detected',a.lang],['Fault type classified',`${CLASSES[a.cls].label} · ${Math.round(a.conf*100)}%`],['Entities extracted (NER)',`${a.ents.length} found`],['Severity scored',`${a.sev.label} · ${a.sev.score}/100`],['Location geocoded',a.geo?a.geo.zone.name:'Not found'],['Duplicate check',a.dup?'Match: '+a.dup.id:'New fault']];
  const ul=$('#steps');ul.innerHTML=rows.map(r=>`<li><span class="tick"></span><b>${r[0]}</b><em></em></li>`).join('');
  $('#result').innerHTML='';
  const lis=$$('li',ul);
  const step=i=>{
    if(tok!==runTok)return;
    if(i>=rows.length){showResult(a);return}
    lis[i].classList.add('run');
    setTimeout(()=>{if(tok!==runTok)return;lis[i].classList.remove('run');lis[i].classList.add('done');lis[i].querySelector('.tick').textContent='✓';lis[i].querySelector('em').textContent=rows[i][1];step(i+1)},fast?0:230);
  };
  step(0);
}
function gauge(a){
  const c=a.sev.label==='Critical'?'var(--bad)':a.sev.label==='High'?'var(--warn)':a.sev.label==='Medium'?'var(--lamp)':'var(--ok)',L=169.6;
  return `<svg viewBox="0 0 140 84" width="190" role="img" aria-label="Severity ${a.sev.score} out of 100"><path d="M16 70A54 54 0 0 1 124 70" fill="none" stroke="var(--surface2)" stroke-width="12" stroke-linecap="round"/><path d="M16 70A54 54 0 0 1 124 70" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${(L*(1-a.sev.score/100)).toFixed(1)}"/><text x="70" y="62" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-size="30" font-weight="700" fill="var(--ink)">${a.sev.score}</text><text x="70" y="80" text-anchor="middle" font-size="12" fill="var(--muted)">out of 100</text></svg>`;
}
function hl(t,ents){let o='',p=0;const S_={POLE_ID:'POLE',LOCATION:'LOC',LANDMARK:'LMK',DURATION:'TIME',FAULT:'FAULT'};for(const e of ents){o+=esc(t.slice(p,e.s))+`<mark class="ent e-${e.label}" title="${e.label}">${esc(e.text)}<small>${S_[e.label]}</small></mark>`;p=e.e}return o+esc(t.slice(p))}
function showResult(a){
  const cl=CLASSES[a.cls],due=SLA[a.sev.label],g=a.geo;
  const ref=a.dup?a.dup.id:'TKT-'+S.seq;
  const reply=g?`Thank you. We logged your report near ${g.zone.name} as ${ref} (${a.sev.label.toLowerCase()} priority). A crew will visit within ${due} hours. We will message you once it is fixed.`:`Thank you. We could not tell where the light is. Please reply with a nearby landmark or share your WhatsApp location pin so we can send a crew.`;
  $('#result').innerHTML=`<div class="grid two">
   <div class="card"><h3>Entities found in the message</h3><p class="sub">Named Entity Recognition tags each phrase the crew needs</p>
     <div class="hltext">${hl(a.text,a.ents)}</div>
     <div class="row wrap" style="gap:6px;margin-top:6px">${['POLE_ID','LOCATION','LANDMARK','DURATION','FAULT'].map(k=>`<mark class="ent e-${k}" style="font-size:12px">${k}</mark>`).join('')}</div></div>
   <div class="card"><h3>Severity</h3><p class="sub">Rule-weighted score using danger words, place, people at risk and how long it has been faulty</p>
     <div class="row wrap" style="gap:16px;align-items:center">${gauge(a)}<div>${sevChip(a.sev.label)}<div class="sub" style="margin-top:6px">Fix within ${due} hours</div></div></div>
     <ul class="why">${a.sev.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
  </div>
  <div class="grid two">
   <div class="card"><h3>Fault type</h3><p class="sub">Model confidence across all eight classes</p>
     ${a.probs.slice(0,4).map(p=>`<div class="prob"><span>${CLASSES[p.k].label}</span><div class="bar"><i style="width:${Math.max(3,p.p*100).toFixed(0)}%;background:${CLASSES[p.k].color}"></i></div><span class="mono">${Math.round(p.p*100)}%</span></div>`).join('')}
     ${a.conf<.55?'<div class="note warn">Confidence is below 55%, so this ticket goes to a human for review.</div>':''}

/* ───────────── scheduling ───────────── */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),KM=.026;
const prio=t=>t.sev+Math.min(40,(Date.now()-t.ts)/36e5*1.2);
function buildSchedule(mode){
  const open=S.tickets.filter(t=>t.status==='open'&&t.x!=null);
  const techs=TECHS.map(t=>({...t,jobs:[]})),cap=8,deferred=[];
  if(mode==='manual'){
    open.slice().sort((a,b)=>a.ts-b.ts).forEach((t,i)=>{const T=techs[i%techs.length];T.jobs.length<cap?T.jobs.push(t):deferred.push(t)});
  }else{
    open.slice().sort((a,b)=>prio(b)-prio(a)).forEach(t=>{
      let best=null,bc=1e9;
      techs.forEach(T=>{if(T.jobs.length>=cap||(t.cls==='hazard'&&!T.hv))return;
        const c=.7*dist(T.depot,t)+.3*Math.min(dist(T.depot,t),...T.jobs.map(j=>dist(j,t)))+T.jobs.length*9;if(c<bc){bc=c;best=T}});
      best?best.jobs.push(t):deferred.push(t);
    });
    techs.forEach(T=>{const left=T.jobs.slice(),ord=[];let cur=T.depot;
      const tier=j=>j.sevLabel==='Critical'?0:j.sevLabel==='High'?1:2;
      while(left.length){const tmin=Math.min(...left.map(tier));let bi=-1,bv=1e9;left.forEach((j,i)=>{if(tier(j)!==tmin)return;const v=dist(cur,j);if(v<bv){bv=v;bi=i}});const j=left.splice(bi,1)[0];ord.push(j);cur=j}
      T.jobs=ord});
  }
  let km=0,hiSum=0,hiN=0,mism=0;
  techs.forEach(T=>{
    let cur=T.depot,clock=540;T.km=0;T.etas=[];
    T.jobs.forEach(j=>{const d=dist(cur,j)*KM;T.km+=d;clock+=d/22*60;T.etas.push(clock);
      if(j.sevLabel==='Critical'||j.sevLabel==='High'){hiSum+=clock;hiN++}
      if(j.cls==='hazard'&&!T.hv)mism++;clock+=CLASSES[j.cls].mins;cur=j});
    if(T.jobs.length)T.km+=dist(cur,T.depot)*KM;km+=T.km;
  });
  return {techs,km,hiAvg:hiN?hiSum/hiN:null,planned:techs.reduce((a,T)=>a+T.jobs.length,0),deferred,mism};
}
function pgSchedule(){

  const man=buildSchedule('manual'),opt=buildSchedule('opt'),cur=S.mode==='opt'?opt:man;
  const pct=man.km?Math.round((1-opt.km/man.km)*100):0;
  $('#view').innerHTML=`<div class="card"><div class="row between wrap"><div><h3>Shift plan</h3><p class="sub">${open} open tickets · ${TECHS.length} crews · up to 8 jobs each · shift starts 9:00 AM</p></div>

    <div class="stack">${cur.techs.map(T=>`<div class="card tech" style="--c:${T.color}"><div class="row between"><div><b>${T.name}</b><div class="sub">${T.skill} · from ${T.depot.zone}</div></div><span class="chip c-mute">${T.jobs.length} jobs · ${T.km.toFixed(1)} km</span></div>
      <ol>${T.jobs.map((j,i)=>`<li><span class="n">${i+1}</span><span>${CLASSES[j.cls].label} <span class="sub">· ${j.zone?ZM[j.zone].name:''} · <span class="mono">${j.id}</span></span></span><span class="row" style="gap:6px">${sevChip(j.sevLabel)}<span class="mono">${fmtClock(T.etas[i])}</span></span></li>`).join('')||'<li style="grid-template-columns:1fr">No jobs assigned</li>'}</ol></div>`).join('')}
     ${cur.deferred.length?`<div class="note warn">${cur.deferred.length} lower-priority tickets are deferred to the next shift because every crew is full.</div>`:''}</div></div>`;
  bindMap($('#sMap'));
  $$('#mSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;pgSchedule()});
  $('#disp').onclick=()=>{
    opt.techs.forEach(T=>T.jobs.forEach((j,i)=>{const t=S.tickets.find(k=>k.id===j.id);t.status='assigned';t.tech=T.name;t.eta=T.etas[i];const l=LMAP.get(t.lampId);if(l)l.status='assigned'}));
    toast(`${opt.planned} jobs sent to ${opt.techs.filter(T=>T.jobs.length).length} crews.`);renderNav();pgSchedule();
  };
  if($('#done'))$('#done').onclick=()=>{
    S.tickets.filter(t=>t.status==='assigned').forEach(t=>{t.status='resolved';const l=LMAP.get(t.lampId);if(l){l.status='ok';l.f90++}});
    toast('Shift complete. Assigned lamps are back online.');renderNav();pgSchedule();
  };
}

/* ───────────── alerts ───────────── */
function computeAlerts(){
  const A=[],now=Date.now(),op=S.tickets.filter(t=>t.status==='open');
  op.filter(t=>t.sevLabel==='Critical').slice(0,6).forEach(t=>A.push({key:'c'+t.id,lvl:'Critical',title:`${CLASSES[t.cls].label} in ${ZM[t.zone].name}`,detail:`${t.id} · reported ${ago(t.ts)} via ${t.channel}. Crew needed: ${CLASSES[t.cls].crew}.`,go:'schedule',cta:'Plan crew'}));
  const late=op.filter(t=>t.due<now);if(late.length)A.push({key:'late'+late.length,lvl:'High',title:`${late.length} tickets are past their SLA`,detail:`Oldest: ${late.sort((a,b)=>a.due-b.due)[0].id}, ${ago(late[0].ts)}.`,go:'schedule',cta:'Plan crew'});
  const soon=op.filter(t=>t.due>=now&&t.due-now<2*36e5);if(soon.length)A.push({key:'soon'+soon.length,lvl:'Medium',title:`${soon.length} tickets reach their SLA within 2 hours`,detail:'Assign them before the deadline passes.',go:'schedule',cta:'Plan crew'});
  clusters().filter(c=>c.n>=4).forEach(c=>A.push({key:'h'+c.zone.id+c.n,lvl:'High',title:`Hotspot near ${c.zone.name}: ${c.n} faulty lamps`,detail:'Likely a shared cause such as a feeder or MCB. One inspection may clear several tickets.',go:'hotspots',cta:'See hotspot'}));
  zoneStats().sort((a,b)=>b.risk-a.risk).slice(0,2).forEach(z=>A.push({key:'r'+z.z.id,lvl:'Medium',title:`${z.z.name} has a high predicted failure risk`,detail:`Average 14-day risk ${Math.round(z.risk*100)}% across ${z.n} lamps. Consider a preventive round.`,go:'predict',cta:'See predictions'}));
  const rev=S.tickets.filter(t=>t.status==='review');if(rev.length)A.push({key:'rev'+rev.length,lvl:'Low',title:`${rev.length} complaint${rev.length>1?'s':''} without a usable location`,detail:'An automatic reply asked the citizen for a landmark or WhatsApp pin.',go:'analyze',cta:'Open analyzer'});
  const o={Critical:0,High:1,Medium:2,Low:3};return A.sort((a,b)=>o[a.lvl]-o[b.lvl]);
}
const alertCount=()=>computeAlerts().filter(a=>(a.lvl==='Critical'||a.lvl==='High')&&!S.ack.has(a.key)).length;

$('#liveBtn').onclick=()=>{S.live=!S.live;$('#liveBtn').setAttribute('aria-pressed',S.live);$('#liveBtn').classList.toggle('off',!S.live);$('#liveTxt').textContent=S.live?'Live intake':'Intake paused'};
$('#reset').onclick=()=>{initData();S.an.text='';poolI=0;go('overview');toast('Demo data reset.')};
initData();
setTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
go('overview');
setInterval(liveTick,11000);
</script>
